services:
  silverbulletapp:
    # SilverBullet 3.0 edge slim, pinned to immutable multi-arch manifest (2026-11-22).
    image: ghcr.io/silverbulletmd/silverbullet@sha256:f672bf25b2b32f7bf4eacd67f778bf1e6fc3a56d0d196a91fd93c91ea8765aab
    restart: unless-stopped
    user: "${HOST_UID:?}:${HOST_GID:?}"
    environment:
      SB_FOLDER: /data
      SB_UPDATE_CHECK: "0"
      SB_SHELL_BACKEND: "off"
      SB_DISABLE_SERVICE_WORKER: "1"
    volumes:
      - type: bind
        source: "${SWITCHBOARD_ADDON_STATE:?}/server"
        target: /data
      - type: bind
        source: "${SWITCHBOARD_ADDON_STATE:?}/space"
        target: /data/spaces/knowledge
    networks:
      addons:
        aliases: ["addon-${SWITCHBOARD_ADDON_INSTANCE}-silverbulletapp"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  silverbulletbootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "silverbullet_mcp.bootstrap"]
    restart: on-failure
    user: "${HOST_UID:?}:${HOST_GID:?}"
    environment:
      HOME: /tmp
      KNOWLEDGE_BASE_URL: "http://addon-${SWITCHBOARD_ADDON_INSTANCE}-silverbulletapp:3000"
      SILVERBULLET_BOOTSTRAP_SECRETS_DIR: /run/addon-secrets
    volumes:
      - type: bind
        source: "${SWITCHBOARD_ADDON_STATE:?}/secrets"
        target: /run/addon-secrets
    networks:
      addons:
        aliases: ["addon-${SWITCHBOARD_ADDON_INSTANCE}-silverbulletbootstrap"]
    depends_on: [silverbulletapp]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  silverbulletadapter:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${HOST_UID:?}:${HOST_GID:?}"
    environment:
      HOME: /tmp
      SILVERBULLET_MCP_PORT: "8773"
      SILVERBULLET_MCP_BIND_HOST: "0.0.0.0"
      SILVERBULLET_MCP_TOKEN_FILE: /run/secrets/silverbullet-mcp-token
      KNOWLEDGE_SPACE_DIR: /knowledge
      SILVERBULLET_MCP_WRITE_ENABLED: "true"
      KNOWLEDGE_TOKEN_FILE: /run/secrets/silverbullet-token
      KNOWLEDGE_BASE_URL: "http://addon-${SWITCHBOARD_ADDON_INSTANCE}-silverbulletapp:3000"
    volumes:
      - type: bind
        source: "${SWITCHBOARD_ADDON_STATE:?}/space"
        target: /knowledge
        read_only: true
      - type: bind
        source: "${SWITCHBOARD_ADDON_STATE:?}/secrets/token"
        target: /run/secrets/silverbullet-token
        read_only: true
      - type: bind
        source: "${SWITCHBOARD_ADDON_STATE:?}/secrets/mcptoken"
        target: /run/secrets/silverbullet-mcp-token
        read_only: true
    networks:
      addons:
        aliases: ["addon-${SWITCHBOARD_ADDON_INSTANCE}"]
    depends_on:
      silverbulletbootstrap:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  addons:
    external: true
    name: "${SWITCHBOARD_ADDONS_NETWORK:?}"
